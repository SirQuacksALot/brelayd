name: package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release

      - name: Strip debug symbols
        run: strip -s target/release/brelayd

      - name: Build Debian package
        run: cargo deb --no-build

      - name: Build RPM package
        run: cargo generate-rpm

      - name: Build portable tarball
        run: |
          mkdir -p dist stage
          cp target/release/brelayd stage/
          cp config.example.toml README.md LICENSE stage/
          cp contrib/brelayd.service stage/
          tar -C stage -czf dist/brelayd-x86_64-linux-gnu.tar.gz .
          rm -rf stage

      - name: Collect .deb and .rpm
        run: |
          mkdir -p dist
          find target -name '*.deb' -exec cp {} dist/ \;
          find target -name '*.rpm' -exec cp {} dist/ \;
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
